name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Labs run Aliquot on Windows, macOS or Linux; 22.13 is the oldest Node version the README supports.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
