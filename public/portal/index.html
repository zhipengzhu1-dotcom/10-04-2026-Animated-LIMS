<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1312" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>Client portal</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <!-- Critical CSS for the splash: paints on the first frame, before any script or stylesheet arrives. -->
  <style>
    :root {
      --bg: #f6f7f6; --ink: #13201e; --muted: #61706d; --faint: #8b9794; --line: #e2e7e5; --accent: #0f766e; --accent-ink: #fff;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0c1312; --ink: #e6eeec; --muted: #94a4a0; --faint: #6c7b78; --line: #1f2c2a; --accent: #2aa596; --accent-ink: #04211d; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #0c1312; --ink: #e6eeec; --muted: #94a4a0; --faint: #6c7b78; --line: #1f2c2a; --accent: #2aa596; --accent-ink: #04211d; color-scheme: dark; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); transition: opacity .28s ease, visibility 0s linear .28s; }
    .splash.is-done { opacity: 0; visibility: hidden; }
    .splash-inner { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 24px; animation: splash-in .45s cubic-bezier(.2,.7,.2,1) both; }
    .splash-mark { width: 48px; height: 48px; display: block; }
    .splash-mark rect { fill: var(--accent); }
    .splash-mark .ink { stroke: var(--accent-ink); }
    .splash-mark .fill { fill: var(--accent-ink); }
    .splash-name { margin-top: 20px; min-height: 24px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; transition: opacity .3s ease; }
    .splash-name:empty { opacity: 0; }
    .splash-sub { margin-top: 2px; font-size: 13px; color: var(--muted); letter-spacing: .01em; }
    .splash-track { position: relative; width: 132px; height: 2px; margin-top: 28px; border-radius: 2px; background: var(--line); overflow: hidden; opacity: 0; animation: splash-show .2s ease .15s forwards; }
    .splash-track span { position: absolute; inset: 0 auto 0 0; width: 38%; border-radius: 2px; background: var(--accent); animation: splash-slide 1.25s cubic-bezier(.45,0,.25,1) infinite; }
    .splash-foot { position: absolute; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 16px; font-size: 12px; color: var(--faint); text-align: center; animation: splash-in .45s ease .1s both; }
    .splash-foot svg { flex: none; }
    @keyframes splash-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes splash-show { to { opacity: 1; } }
    @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(265%); } }
    @media (prefers-reduced-motion: reduce) {
      .splash, .splash-name { transition: none; }
      .splash-inner, .splash-foot { animation: none; }
      .splash-track { animation: splash-show 0s linear .15s forwards; }
      .splash-track span { width: 100%; opacity: .45; animation: none; }
    }
    @media print { .splash { display: none; } }
  </style>
  <script src="/portal/boot.js"></script>
  <link rel="stylesheet" href="/portal/portal.css">
  <script type="module" src="/portal/portal.js"></script>
</head>
<body>
  <div id="splash" class="splash" role="status" aria-live="polite" aria-label="Loading the client portal">
    <div class="splash-inner">
      <svg class="splash-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9"/>
        <path class="ink" d="M12 7h8M13.5 7v11.5a2.5 2.5 0 0 0 5 0V7" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="fill" d="M13.5 15h5v3.5a2.5 2.5 0 0 1-5 0z"/>
        <circle class="fill" cx="16" cy="25.5" r="1.6"/>
      </svg>
      <div class="splash-name" id="splash-name">Welcome</div>
      <div class="splash-sub">Secure client portal</div>
      <div class="splash-track" aria-hidden="true"><span></span></div>
    </div>
    <div class="splash-foot">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span id="splash-trust">Access-controlled · 21 CFR Part 11 audit trail</span>
    </div>
  </div>
  <div id="app"></div>
  <noscript><p style="text-align:center;padding:40px 16px">The client portal needs JavaScript enabled.</p></noscript>
</body>
</html>
